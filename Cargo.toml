[workspace]
members = [
    "xtask",
    "crates/frame-analyzer",
    "crates/frame-analyzer-ebpf-common",
    "crates/dumpsys-rs",
]
exclude = ["crates/frame-analyzer-ebpf"]

[package]
name = "fas-rs"
version = "4.10.0"
edition = "2024"
description = "Frame aware scheduling for android. Requires kernel ebpf support."
authors = ["shadow3"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/KuryxCherry/fas-rs"

[dependencies]
likely_stable = "0.1.3"
parking_lot = "0.12.5"
thiserror = "2.0.21"
log = "0.4.35"
anyhow = { version = "1.0.105" }
inotify = { version = "0.11.5", default-features = false }
flexi_logger = "0.32.0"
libc = "0.2.191"
toml = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
sys-mount = { version = "3.1.1", default-features = false }
quick-xml = { version = "0.42.0", features = ["serialize"] }
mlua = { version = "0.12.3", features = ["luajit", "vendored", "error-send"] }
frame-analyzer = { path = "crates/frame-analyzer" }
dumpsys-rs = { path = "crates/dumpsys-rs" }
mimalloc = { version = "0.1.52", features = ["no_thp", "override"] }
num_cpus = "1.17.0"
nix = { version = "0.31.4", features = ["sched"] }

[build-dependencies]
anyhow = "1.0.105"
toml = "1.2.3"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
overflow-checks = false
opt-level = 3
strip = true

[profile.release]
overflow-checks = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
