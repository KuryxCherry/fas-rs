name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib zstd unzip
      - name: Setup NDK
        run: |
          ndk_url=$(curl -fsSL https://api.github.com/repos/android/ndk/releases/latest | grep -oE 'https://dl\.google\.com/android/repository/android-ndk-r[0-9]+[a-z]?-linux\.zip' | head -n 1 || true)
          if [ -z "$ndk_url" ]; then
            ndk_url=$(wget -qO- https://github.com/android/ndk/releases/latest | grep -oE 'https://dl\.google\.com/android/repository/android-ndk-[^"<>]*-linux\.zip' | head -n 1)
          fi
          echo "Downloading NDK: $ndk_url"
          curl -fsSL "$ndk_url" -o ndk.zip
          mkdir -p ~/ndk_temp
          unzip -q ndk.zip -d ~/ndk_temp
          mv ~/ndk_temp/*/* ~/ndk_temp
          rm -f ndk.zip
      - name: Setup Rust toolchains
        run: |
          rustup toolchain install nightly --component rust-src --target aarch64-linux-android
          rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Setup bpf-linker and cargo-ndk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst -o bpf-linker.tar.zst
          tar --zstd -xpf bpf-linker.tar.zst -C "$HOME/.local/bin"
          rm -f bpf-linker.tar.zst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version
          cargo install cargo-ndk --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build release
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cargo xtask build -r -v
      - name: Cleanup
        run: rm -rf ~/ndk_temp
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/release
          unzip -q "output/fas-rs(release).zip" -d output/artifact/release
      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(release)
          compression-level: 9
          path: output/artifact/release

  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib zstd unzip
      - name: Setup NDK
        run: |
          ndk_url=$(curl -fsSL https://api.github.com/repos/android/ndk/releases/latest | grep -oE 'https://dl\.google\.com/android/repository/android-ndk-r[0-9]+[a-z]?-linux\.zip' | head -n 1 || true)
          if [ -z "$ndk_url" ]; then
            ndk_url=$(wget -qO- https://github.com/android/ndk/releases/latest | grep -oE 'https://dl\.google\.com/android/repository/android-ndk-[^"<>]*-linux\.zip' | head -n 1)
          fi
          echo "Downloading NDK: $ndk_url"
          curl -fsSL "$ndk_url" -o ndk.zip
          mkdir -p ~/ndk_temp
          unzip -q ndk.zip -d ~/ndk_temp
          mv ~/ndk_temp/*/* ~/ndk_temp
          rm -f ndk.zip
      - name: Setup Rust toolchains
        run: |
          rustup toolchain install nightly --component rust-src --target aarch64-linux-android
          rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Setup bpf-linker and cargo-ndk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst -o bpf-linker.tar.zst
          tar --zstd -xpf bpf-linker.tar.zst -C "$HOME/.local/bin"
          rm -f bpf-linker.tar.zst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version
          cargo install cargo-ndk --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build debug
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cargo xtask build -v
      - name: Cleanup
        run: rm -rf ~/ndk_temp
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/debug
          unzip -q "output/fas-rs(debug).zip" -d output/artifact/debug
      - name: Upload debug version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(debug)
          compression-level: 9
          path: output/artifact/debug
